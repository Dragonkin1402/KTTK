<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Todo App</title>
<style>
:root{--accent:#6ee7b7;--muted:#9aa5b1}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#071024,#071b2a);color:#e6eef6;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px}
.wrap{width:100%;max-width:720px}
.card{background:rgba(255,255,255,.03);padding:18px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,.6)}
.row{display:flex;gap:8px}
input[type=text]{flex:1;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:inherit;font-size:1rem}
button{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);cursor:pointer}
#add-btn{background:var(--accent);color:#042023;font-weight:600;border:none}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px}
.filters{display:flex;gap:8px}
.filters button.active{border-color:var(--accent);color:var(--accent);font-weight:600}
ul{list-style:none;padding:0;margin:14px 0 0;max-height:60vh;overflow:auto}
li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.04);margin-bottom:8px}
li .title{flex:1;word-break:break-word}
li.done .title{text-decoration:line-through;opacity:.6}
.small{font-size:.9rem;color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Todo List</h1>
  <section class="card">
    <div class="row">
      <input id="todo-input" type="text" maxlength="50" placeholder="Thêm việc... (nhấn Enter để lưu)" />
      <button id="add-btn">Thêm</button>
    </div>
    <div class="controls">
      <div class="filters">
        <button data-filter="all" class="active">Tất cả</button>
        <button data-filter="active">Chưa xong</button>
        <button data-filter="completed">Đã xong</button>
      </div>
      <div><span class="small" id="count">0 việc</span>
        <button id="clear-completed" title="Xóa đã hoàn thành">X</button></div>
    </div>
    <ul id="list"></ul>
    <div id="empty" class="empty" hidden>Không có công việc. Thêm việc mới ở trên.</div>
    <div id="status" class="small" style="margin-top:8px"></div>
  </section>
</div>
<script>
const API_BASE = 'http://localhost:5208/api/v1/todos';
const $ = id => document.getElementById(id);
let todos = [], filter = 'all';

const setStatus = m => $('status').textContent = m || '';

async function api(path = '', opt = {}) {
  const res = await fetch(API_BASE + path, { headers: { 'Content-Type': 'application/json' }, ...opt });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.status === 204 ? null : res.json();
}

async function load() {
  try {
    setStatus('Đang tải dữ liệu từ API...');
    todos = await api('', { cache: 'no-store' });
    setStatus('Đồng bộ với API.');
  } catch (e) {
    setStatus('Không thể kết nối API: ' + e.message);
  }
  render();
}

async function run(fn) {
  try { await fn(); await load(); }
  catch (e) { setStatus('Lỗi: ' + e.message); }
}

const add = text => { text = (text || '').trim(); if (!text) return;
  $('todo-input').value = '';
  run(() => api('', { method: 'POST', body: JSON.stringify({ title: text, isCompleted: false }) })); };
const toggle = t => run(() => api('/' + t.id, { method: 'PUT', body: JSON.stringify({ ...t, isCompleted: !t.isCompleted }) }));
const remove = id => run(() => api('/' + id, { method: 'DELETE' }));
const edit = (t, title) => title === '' ? remove(t.id)
  : title !== t.title && run(() => api('/' + t.id, { method: 'PUT', body: JSON.stringify({ ...t, title }) }));
const clearCompleted = () => run(() => Promise.all(todos.filter(t => t.isCompleted).map(t => api('/' + t.id, { method: 'DELETE' }))));

function render() {
  const visible = todos.filter(t => filter === 'all' || (filter === 'active' ? !t.isCompleted : t.isCompleted));
  const list = $('list'); list.innerHTML = '';
  $('empty').hidden = visible.length > 0;
  visible.forEach(t => {
    const li = document.createElement('li');
    li.className = t.isCompleted ? 'done' : '';
    const chk = document.createElement('input');
    chk.type = 'checkbox'; chk.checked = !!t.isCompleted;
    chk.onchange = () => toggle(t);
    const title = document.createElement('div');
    title.className = 'title'; title.textContent = t.title; title.contentEditable = true;
    title.onblur = () => edit(t, title.textContent.trim());
    title.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); title.blur(); } };
    const del = document.createElement('button');
    del.textContent = '🗑'; del.title = 'Xóa'; del.onclick = () => remove(t.id);
    li.append(chk, title, del);
    list.appendChild(li);
  });
  $('count').textContent = todos.filter(t => !t.isCompleted).length + ' việc';
}

$('add-btn').onclick = () => add($('todo-input').value);
$('todo-input').onkeydown = e => { if (e.key === 'Enter') add(e.target.value); };
$('clear-completed').onclick = clearCompleted;
document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.filters button').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); filter = b.dataset.filter; render();
});
load();
</script>
</body>
</html>
